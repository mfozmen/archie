name: Claude AI Review

# Advisory AI code review using anthropics/claude-code-action@v1.
#
# Auth: the Claude SUBSCRIPTION via claude_code_oauth_token — NOT an API key.
# Generate the token locally with `claude setup-token`, then add it as the
# CLAUDE_CODE_OAUTH_TOKEN repository secret. No Anthropic API key lives in this
# repo, so reviews draw from the subscription quota.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork safety: use `pull_request` (never `pull_request_target`) and only run
    # when the PR head repo is THIS repo, so the subscription token is never
    # exposed to forked PRs.
    if: >
      ( github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository ) ||
      ( github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            You are reviewing this pull request as an ADVISORY reviewer for
            Archie — an open-source Claude Code plugin that builds an
            evidence-backed, incrementally-growing map of a legacy codebase
            (`/archie:inventory|explain|wiki|status|recipe|config`). Do NOT
            approve or block the PR — leave the verdict to the human.

            How to publish your review:
            - Use `mcp__github_inline_comment__create_inline_comment` for concrete
              findings on specific changed lines.
            - Use `gh pr comment` for ONE concise top-level summary. ALWAYS post
              it, even if nothing is notable (say so briefly), so the run leaves a
              visible result.

            Archie is half deterministic Node scripts under `scripts/`, half
            prompt surfaces (`skills/`, `agents/`). The design spec is
            `docs/specs/2026-08-25-archie-design.md` and the implementation plan
            is `docs/plans/2026-08-25-archie-v1.md` — read the relevant part
            before judging intent. Review for:

            - **Honesty invariants (highest priority).** Archie must never state
              system behavior without a `file:line` citation, and must never fill
              a gap with a guess instead of an UNKNOWN. The adversarial verifier
              may only DELETE or DEMOTE claims — never add or rephrase. The
              `wiki` and `status` surfaces must stay LLM-free/deterministic.
              Any change weakening these is Critical.
            - **Correctness + TDD.** Deterministic code needs tests that assert
              real behavior, written test-first. Check the tests actually fail
              without the implementation (would they?), and that renderers are
              deterministic (no Date/random/iteration-order dependence).
            - **Zero dependencies.** Node >= 18, no npm deps at all (runtime or
              dev). A new dependency is Critical unless the PR argues it.
            - **Open-source hygiene.** Nothing company-, employer-, or
              customer-specific anywhere — files, examples, fixtures, or commit
              messages. All examples must be synthetic (web-shop domain:
              orders/shipments/notifications). See REVIEW.md §1. Critical.
            - **Scope invariants.** Archie writes only under `.archie/` in the
              analyzed repo; single-repo boundary (outbound calls are labelled
              boxes, never followed); the structural model stays the single
              source of truth — no view may carry content absent from the model.
            - **Prompt quality** for `skills/` and `agents/`: unambiguous, the
              stated JSON contract matches the schemas in `scripts/lib/model.js`,
              and hard rules are stated as rules (not suggestions).
            - **Conventions:** English-only in code and docs; Conventional
              Commits; plugin.json / package.json versions in sync.

            Group findings by severity (Critical / Warning / Suggestion), be
            concise and specific, cite file and line. Don't nitpick style.

            Spend turns economically: fetch the diff once with `gh pr diff` and
            don't re-fetch; leave inline comments only for the most important
            issues; post the single summary comment last so it always lands.
