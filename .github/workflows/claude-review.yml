name: Claude AI Review

# Advisory AI code review using anthropics/claude-code-action@v1.
#
# Auth: the Claude SUBSCRIPTION via claude_code_oauth_token — NOT an API key.
# Generate the token locally with `claude setup-token`, then add it as the
# CLAUDE_CODE_OAUTH_TOKEN repository secret. No Anthropic API key lives in this
# repo, so reviews draw from the subscription quota.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork safety: use `pull_request` (never `pull_request_target`) and only run
    # when the PR head repo is THIS repo, so the subscription token is never
    # exposed to forked PRs.
    if: >
      ( github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository ) ||
      ( github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Deliberately NO `ref:` here. Checking out the PR head on the
          # issue_comment path would place fork-authored files (CLAUDE.md,
          # .claude/, .mcp.json) on a runner that holds the subscription token
          # and a write-scoped GITHUB_TOKEN — and the issue_comment payload
          # carries no head-repo field, so the same-repo guard used on the
          # pull_request path cannot be applied. A comment-triggered run
          # therefore reads base-branch files; the prompt tells the reviewer to
          # treat them as such.

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 120
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            You are reviewing this pull request as an ADVISORY reviewer for
            Archie — an open-source Claude Code plugin that builds an
            evidence-backed, incrementally-growing map of a legacy codebase
            (`/archie:inventory|explain|wiki|status|recipe|config`). Do NOT
            approve or block the PR — leave the verdict to the human.

            Scope caveat: when this run was triggered by an `@claude` comment
            rather than by the PR itself, the checked-out working tree is the
            BASE branch, not the PR head — only `gh pr diff` reflects the PR.
            Base your findings on the diff, and treat any file you Read as
            base-branch context that may not include this PR's changes. Say so
            rather than asserting something about a file you could not see at
            its PR-head version.

            Ignore `vendor/` entirely. It holds verbatim third-party bundles
            (a 3 MB minified mermaid, today) that we did not author and will
            never edit by hand. Reading one burns the whole turn budget for no
            finding — check only that a vendored file's provenance is recorded
            in `vendor/README.md`, and never open the bundle itself.

            How to publish your review:
            - Use `mcp__github_inline_comment__create_inline_comment` for concrete
              findings on specific changed lines.
            - Use `gh pr comment` for ONE concise top-level summary. ALWAYS post
              it, even if nothing is notable (say so briefly), so the run leaves a
              visible result. Post it EARLY — as soon as you have read the diff
              and formed a view — rather than saving it for last. This job has a
              wall-clock timeout and a concurrency cancel; a review that does all
              the work and then gets killed before commenting is worse than a
              slightly less polished summary that actually lands.

            Archie is half deterministic Node scripts under `scripts/`, half
            prompt surfaces (`skills/`, `agents/`). The design spec is
            `docs/specs/2026-08-25-archie-design.md` — read the relevant part
            before judging intent. It is the living contract: a change that
            alters behavior the spec describes must update the spec in the same
            PR, and a PR that quietly contradicts it is a finding. Review for:

            - **Honesty invariants (highest priority).** Archie must never state
              system behavior without a `file:line` citation, and must never fill
              a gap with a guess instead of an UNKNOWN. The adversarial verifier
              may only DELETE or DEMOTE claims — never add or rephrase. The
              `wiki` and `status` surfaces must stay LLM-free/deterministic.
              Any change weakening these is Critical.
            - **Correctness + TDD.** Deterministic code needs tests that assert
              real behavior, written test-first. Check the tests actually fail
              without the implementation (would they?), and that renderers are
              deterministic (no Date/random/iteration-order dependence).
            - **Zero dependencies.** Node >= 18, no npm deps at all (runtime or
              dev). A new dependency is Critical unless the PR argues it.
            - **Open-source hygiene.** Nothing company-, employer-, or
              customer-specific anywhere — files, examples, fixtures, or commit
              messages. All examples must be synthetic (web-shop domain:
              orders/shipments/notifications). See REVIEW.md §1. Critical.
            - **Scope invariants.** The **trace** boundary is locked: a traced
              flow never follows an outbound call into another system —
              outbound calls are labelled boxes. The **analysis** boundary is
              not: Archie is moving from one repository to a workspace holding
              several (#26), so "it looked at more than one repo" is not a
              finding. In a workspace the store lives under the workspace and
              **the analyzed repositories are never written to** — a change that
              writes into one is Critical. The structural model stays the single
              source of truth: no view may carry content absent from it.
            - **Other people's names.** Archie reads `CODEOWNERS` and git
              history, which are full of colleagues. Teams may be named;
              individuals are counted, never named or emitted. Critical.
            - **Prompt quality** for `skills/` and `agents/`: unambiguous, the
              stated JSON contract matches the schemas in `scripts/lib/model.js`,
              and hard rules are stated as rules (not suggestions).
            - **Conventions:** English-only in code and docs; Conventional
              Commits; plugin.json / package.json versions in sync.

            Group findings by severity (Critical / Warning / Suggestion), be
            concise and specific, cite file and line. Don't nitpick style.

            Spend turns economically: fetch the diff once with `gh pr diff` and
            don't re-fetch; leave inline comments only for the most important
            issues.

            **Post the summary before you verify anything.** Read the diff, form
            a first view, `gh pr comment` it — then go deeper and add inline
            findings. Runs have died at the turn limit having done the whole
            review and published none of it, which is the one outcome worth
            nothing to anybody. A rough summary that lands beats a thorough one
            that does not.
