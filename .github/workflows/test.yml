name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Unit tests
        run: npm test
      - name: Leak scanner self-check
        run: bash scripts/leak-scan.test.sh
