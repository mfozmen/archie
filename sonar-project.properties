# SonarCloud's GitHub onboarding derives these from the repository. Correct them
# here if the project was created with different ones.
sonar.projectKey=mfozmen_archie
sonar.organization=mfozmen

sonar.sources=scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# vendor/ is a 3.4 MB minified third-party bundle we did not author and will
# never edit. Analysing it would bury every real finding, which is the same
# reason leak-scan.sh and .gitattributes already exclude it.
sonar.exclusions=vendor/**,node_modules/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# S1135 flags "TODO" in source. render.js emits one INTO generated OpenAPI, on
# purpose: a request body is not derivable from static evidence and inventing
# one would be a lie. It is output, not a backlog item, and saying that here
# beats obfuscating the string so a scanner cannot see it.
# S3800 asks a function to always return the same type, and reports procKind as
# if it might not. It does: the two table entries it can return are the string
# literals in PROC_KINDS, alongside 'web' and 'unknown'. Sonar loses the type
# destructuring `kind` out of an array-of-arrays; the code is not ambiguous.
# The alternative is wrapping an already-string value in String() to convince a
# scanner, which is the same cleverness the rule below refuses. The cost of the
# file-wide scope is real and accepted: a genuine future S3800 in this 120-line
# file would also be hidden.
sonar.issue.ignore.multicriteria=todoInOutput,returnTypeInProcKind
sonar.issue.ignore.multicriteria.todoInOutput.ruleKey=javascript:S1135
sonar.issue.ignore.multicriteria.todoInOutput.resourceKey=scripts/render.js
sonar.issue.ignore.multicriteria.returnTypeInProcKind.ruleKey=javascript:S3800
sonar.issue.ignore.multicriteria.returnTypeInProcKind.resourceKey=scripts/fingerprint.js
